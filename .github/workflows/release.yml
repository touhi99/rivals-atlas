name: release

# A tag like v0.1.0 builds the wheel (with the React app inside), publishes it to PyPI, and
# attaches the two launchers to a GitHub release. The launchers install with `uvx rivals-atlas`,
# so they always pick up the newest published version and never have to be rebuilt.

on:
  push:
    tags: ["v*"]

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  pypi:
    needs: wheel
    # Set the repository variable PUBLISH_TO_PYPI to true once the PyPI account is ready.
    # Until then the release still works: the zips below carry the wheel.
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write            # PyPI trusted publishing; no token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # LadybugDB's macOS wheel loads OpenSSL from Homebrew by absolute path. The launchers
  # carry these two libraries so a Mac without Homebrew can still run the graph engine.
  macos-libraries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: arm64
            prefix: /opt/homebrew
          - runner: macos-15-intel    # Intel
            arch: x86_64
            prefix: /usr/local
    runs-on: ${{ matrix.runner }}
    steps:
      - run: brew install openssl@3
      - run: |
          mkdir -p out/${{ matrix.arch }}
          cp ${{ matrix.prefix }}/opt/openssl@3/lib/libssl.3.dylib \
             ${{ matrix.prefix }}/opt/openssl@3/lib/libcrypto.3.dylib \
             out/${{ matrix.arch }}/
      - uses: actions/upload-artifact@v4
        with:
          name: openssl-${{ matrix.arch }}
          path: out/${{ matrix.arch }}

  release:
    needs: [wheel, macos-libraries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: openssl-*
          path: dist/openssl
      - name: Assemble the launchers
        run: |
          mkdir -p dist/windows dist/macos/openssl
          cp "installers/windows/Start Rivals Atlas.bat" dist/windows/
          cp installers/windows/README.txt dist/windows/
          cp dist/*.whl dist/windows/
          (cd dist/windows && zip -ry ../RivalsAtlas-windows.zip .)

          # Each artifact is named openssl-<arch>; the launcher looks for openssl/<arch>.
          mv dist/openssl/openssl-arm64 dist/macos/openssl/arm64
          mv dist/openssl/openssl-x86_64 dist/macos/openssl/x86_64
          cp "installers/macos/Start Rivals Atlas.command" dist/macos/
          cp installers/macos/README.txt dist/macos/
          cp dist/*.whl dist/macos/
          chmod +x "dist/macos/Start Rivals Atlas.command"
          (cd dist/macos && zip -ry ../RivalsAtlas-macos.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RivalsAtlas-windows.zip
            dist/RivalsAtlas-macos.zip
            dist/*.whl
          body: |
            Download for your computer, unzip it, and start the launcher inside:

            - **Windows:** `RivalsAtlas-windows.zip` — double-click `Start Rivals Atlas.bat`.
            - **macOS:** `RivalsAtlas-macos.zip` — right-click `Start Rivals Atlas.command` and choose Open
              the first time.

            The first launch installs what is missing (a minute or two) and opens the dashboard in your
            browser. The launcher uses the published app when it can and otherwise the wheel bundled in
            this zip, so keep the files together.

            From a terminal on any platform: `uvx --from rivals-atlas rivals-atlas serve --open`
