name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - if: runner.os == 'macOS'
        run: brew install openssl@3        # LadybugDB's macOS wheel links to Homebrew's OpenSSL
      - run: uv sync
      - run: uv run ruff check src
      - run: uv run mypy src
