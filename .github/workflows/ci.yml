name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - if: runner.os == 'macOS'
        run: brew install openssl@3        # LadybugDB's macOS wheel links to Homebrew's OpenSSL
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
      - run: npm ci
        working-directory: frontend
      - run: scripts/check
        shell: bash
