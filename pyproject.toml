[project]
name = "rivals-atlas"
version = "0.1.0"
authors = [{ name = "Touhidul Alam" }]
description = "Personal Marvel Rivals match analysis: fetch your match history from rivalsmeta.com, explore it in a dashboard and a hero graph, and chat with a knowledge-graph agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["marvel-rivals", "analytics", "knowledge-graph", "haystack", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "networkx>=3.4",
    "haystack-ai>=3.4.1",
    "ladybug>=0.22.1",
    "ollama-haystack>=7.0.2",
    "anthropic-haystack>=8.0.1",
]

[project.scripts]
rivals-atlas = "rivals_atlas.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=2.4.1",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff.lint]
extend-ignore = ["B008"]  # FastAPI Query()/Depends() defaults

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true      # networkx and ladybug ship no type information
warn_unused_ignores = true
